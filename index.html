<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>JianHut</title><style>body{font-family:system-ui;background:#111;color:#fff;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0;padding:20px}.card{background:#1e1e1e;padding:24px;border-radius:16px;width:100%;max-width:380px}input,textarea{width:100%;padding:12px;border-radius:10px;border:1px solid #333;background:#2a2a2a;color:#fff;margin-bottom:12px;box-sizing:border-box}button{width:100%;padding:13px;border:0;border-radius:10px;background:#25D366;font-weight:700} #result{margin-top:16px;word-break:break-all;background:#2a2a2a;padding:12px;border-radius:10px;display:none} a{color:#25D366}</style></head><body><div class="card"><h1>JianHut</h1><p>Generador de enlaces WhatsApp</p><input id="phone" placeholder="Ej: 521234567890"><textarea id="msg" rows="3" placeholder="Mensaje"></textarea><button onclick="gen()">Generar Link</button><div id="result"></div></div><script>function gen(){let p=document.getElementById('phone').value.replace(/\D/g,'');let m=document.getElementById('msg').value;if(!p){alert('Pon tu numero');return}let url='https://wa.me/'+p+(m?'?text='+encodeURIComponent(m):'');let r=document.getElementById('result');r.style.display='block';r.innerHTML='<a href="'+url+'" target="_blank">'+url+'</a><br><br><button onclick="navigator.clipboard.writeText(\''+url+'\')">Copiar</button>';}</script></body></html>
